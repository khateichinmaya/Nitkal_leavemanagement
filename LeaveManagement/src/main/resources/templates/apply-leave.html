<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Apply Leave</title>
    <style>
        body { font-family: Arial; background: #f8f9fc; padding: 30px; }

        .card {
            max-width: 400px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        select, input {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #4e73df;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover { background:#2e59d9; }

        a {
            display: block;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Apply Leave</h2>

    <form th:action="@{/employee/apply-leave}" method="post">

        <label>Leave Type</label>
        <select name="leaveType" required>
            <option value="SL">Sick Leave</option>
            <option value="EL">Earned Leave</option>
            <option value="ML">Maternity Leave</option>
            <option value="PL">Paternity Leave</option>
            <option value="LOP">Loss of Pay Leave</option>
        </select>

        <label>Start Date</label>
        <input type="date" id="startDate" name="startDate" required>

        <label>End Date</label>
        <input type="date" id="endDate" name="endDate" required>

        <label>Total Days</label>
        <input type="number" id="days" name="numberOfDays" readonly>

        <button type="submit">Apply</button>
    </form>

    <a th:href="@{/employee/dashboard}">Back to Dashboard</a>
</div>

<!-- JS MUST BE BELOW HTML -->
<script>
const start = document.getElementById("startDate");
const end = document.getElementById("endDate");
const days = document.getElementById("days");

function calculateDays(){
    if(start.value && end.value){
        const s = new Date(start.value);
        const e = new Date(end.value);

        const diff = (e - s) / (1000*60*60*24) + 1;

        if(diff > 0)
            days.value = diff;
        else
            days.value = 0;
    }
}

start.addEventListener("change", calculateDays);
end.addEventListener("change", calculateDays);
</script>

</body>
</html>
