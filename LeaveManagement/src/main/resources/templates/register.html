<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Register Employee</title>
    <style>
        body {
            font-family: Arial;
            background: #f8f9fc;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        h2 {
            text-align: center;
            color: #4e73df;
        }

        input, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #1cc88a;
            border: none;
            color: white;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background: #17a673;
        }

        .link {
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Register Employee</h2>

    <form th:action="@{/register}" th:object="${employee}" method="post">

        <label>Name</label>
        <input type="text" th:field="*{name}" required />

        <label>Email</label>
        <input type="email" th:field="*{email}" required />

        <label>Department</label>
        <input type="text" th:field="*{department}" />

        <label>Salary</label>
        <input type="number" th:field="*{salary}" />

        <label>Password</label>
        <input type="password" th:field="*{password}" required />

        <label>Role</label>
        <select th:field="*{role}">
            <option value="EMPLOYEE">Employee</option>
            <option value="ADMIN">Admin</option>
        </select>

        <button type="submit">Register</button>
    </form>

    <div class="link">
        <a th:href="@{/login}">Already have an account? Login</a>
    </div>
</div>

</body>
</html>
