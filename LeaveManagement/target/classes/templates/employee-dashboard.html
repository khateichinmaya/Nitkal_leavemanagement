<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Employee Dashboard</title>
    <style>
        body { font-family: Arial; background: #f8f9fc; padding: 30px; }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            box-shadow: 0 3px 8px rgba(0,0,0,0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            background: white;
        }

        th, td {
            padding: 10px;
            border-bottom: 1px solid #ddd;
            text-align: center;
        }

        th { background: #4e73df; color: white; }

        .apply-btn {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: #1cc88a;
            color: white;
            border-radius: 5px;
            text-decoration: none;
        }

        .logout {
            margin-top: 20px;
            display: inline-block;
            background: #e74a3b;
            color: white;
            padding: 8px 15px;
            border-radius: 5px;
            text-decoration: none;
        }
    </style>
</head>
<body>

<h2>Employee Dashboard</h2>

<div class="card">
    <h3>Leave Balance</h3>
    <p>Sick Leave: <span th:text="${balance.sickLeave}"></span></p>
    <p>Earned Leave: <span th:text="${balance.earnedLeave}"></span></p>
    <a class="apply-btn" th:href="@{/employee/apply-leave}">Apply Leave</a>
</div>

<h3>Leave History</h3>

<table>
    <tr>
        <th>Type</th>
        <th>Days</th>
        <th>Status</th>
    </tr>

    <tr th:each="leave : ${leaveHistory}">
        <td th:text="${leave.leaveType}"></td>
        <td th:text="${leave.numberOfDays}"></td>
        <td th:text="${leave.status}"></td>
    </tr>
</table>

<form th:action="@{/logout}" method="post">
    <button class="logout" type="submit">Logout</button>
</form>


</body>
</html>
